<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | VoltCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body class=" min-vh-100 d-flex align-items-center justify-content-center py-5" style="background-color: var(--bg-secondary) !important;">




    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                
                <!-- Top Bar Toggles -->
                <div class="d-flex justify-content-end gap-3 mb-3 auth-toggles-responsive" dir="ltr">
                    <button class="btn bg-card border border-secondary shadow-sm theme-toggle-btn text-responsive-heading d-flex align-items-center justify-content-center" style="width: 44px; height: 44px; border-radius: 50%;" aria-label="Toggle Theme">
                        <i data-lucide="moon" width="20" height="20"></i>
                    </button>
                    <button class="btn bg-card border border-secondary shadow-sm rtl-toggle-btn text-responsive-heading d-flex align-items-center justify-content-center text-decoration-none" style="width: 44px; height: 44px; border-radius: 50%;" aria-label="Toggle RTL">
                        <i data-lucide="arrow-right-left" width="20" height="20"></i>
                    </button>
                </div>

                <div class="card bg-card border-0 shadow-lg rounded-4 overflow-hidden p-4 p-md-5">
                    <div class="text-center mb-4">
                        <a href="index.html" class="d-flex align-items-center justify-content-center gap-2 text-decoration-none pt-1 pt-md-0">
                            <i data-lucide="zap" class="text-primary" width="36" height="36"></i>
                            <h3 class="font-heading fw-bold mb-0" >VoltCore<span style="color: var(--accent);">.</span></h3>
                        </a>
                    </div>
                    
                    <div class="text-center mb-5">
                        <h2 class="font-heading fw-bold" >Create Account</h2>
                        <p class="text-muted">Fill in your details to get started.</p>
                    </div>
                    
                    <form class="needs-validation" novalidate>
                        <div class="row g-3 mb-3">
                            <div class="col-12">
                                <label class="form-label fw-medium text-responsive-heading">First Name</label>
                                <div class="input-group">
                                    <span class="input-group-text  border-0" style="background-color: var(--bg-secondary) !important; color: var(--text-main) !important;"><i data-lucide="user" width="18"></i></span>
                                    <input type="text" class="form-control form-control-lg border-0" required placeholder="" style="background-color: var(--bg-secondary) !important; color: var(--text-main) !important;">
                                </div>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-medium text-responsive-heading">Last Name</label>
                                <div class="input-group">
                                    <span class="input-group-text  border-0" style="background-color: var(--bg-secondary) !important; color: var(--text-main) !important;"><i data-lucide="user" width="18"></i></span>
                                    <input type="text" class="form-control form-control-lg border-0" required placeholder="" style="background-color: var(--bg-secondary) !important; color: var(--text-main) !important;">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-medium text-responsive-heading">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text  border-0" style="background-color: var(--bg-secondary) !important; color: var(--text-main) !important;"><i data-lucide="mail" width="18"></i></span>
                                <input type="email" class="form-control form-control-lg border-0" required placeholder="name@example.com" style="background-color: var(--bg-secondary) !important; color: var(--text-main) !important;">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-medium text-responsive-heading">Password</label>
                            <div class="input-group">
                                <span class="input-group-text  border-0" style="background-color: var(--bg-secondary) !important; color: var(--text-main) !important;"><i data-lucide="lock" width="18"></i></span>
                                <input type="password" class="form-control form-control-lg border-0" required placeholder="••••••••" style="background-color: var(--bg-secondary) !important; color: var(--text-main) !important;">
                                <span class="input-group-text  border-0" style="background-color: var(--bg-secondary) !important; cursor: pointer; color: var(--text-main) !important;" onclick="togglePasswordVisibility(this)">
                                    <i data-lucide="eye" width="18"></i>
                                </span>
                            </div>
                            <div class="form-text mt-1 small">Must be at least 8 characters long.</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium text-responsive-heading">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text  border-0" style="background-color: var(--bg-secondary) !important; color: var(--text-main) !important;"><i data-lucide="lock" width="18"></i></span>
                                <input type="password" class="form-control form-control-lg border-0" required placeholder="••••••••" style="background-color: var(--bg-secondary) !important; color: var(--text-main) !important;">
                                <span class="input-group-text  border-0" style="background-color: var(--bg-secondary) !important; cursor: pointer; color: var(--text-main) !important;" onclick="togglePasswordVisibility(this)">
                                    <i data-lucide="eye" width="18"></i>
                                </span>
                            </div>
                        </div>
                        
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="terms" required>
                            <label class="form-check-label text-muted small" for="terms">I agree to the <a href="#" class="text-primary">Terms of Service</a> and <a href="#" class="text-primary">Privacy Policy</a>.</label>
                            <div class="invalid-feedback">You must agree before submitting.</div>
                        </div>
                        
                        <button type="submit" class="btn btn-electric btn-lg w-100 mb-4">Create Account</button>
                        
                        <div class="d-flex align-items-center mb-4">
                            <hr class="flex-grow-1 border-secondary">
                            <span class="mx-3 text-muted small">OR</span>
                            <hr class="flex-grow-1 border-secondary">
                        </div>
                        
                        <div class="d-flex gap-3 mb-4">
                            <button type="button" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2 auth-social-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C43.662,34.729,44,31.25,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                                Google
                            </button>
                            <button type="button" class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2 auth-social-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 170 170"><path fill="currentColor" d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.74 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.92 0.21-9.84-1.96-14.74-6.53-3.13-2.73-7.1-7.43-11.87-14.09-5.03-7-9.47-15.11-13.32-24.31-3.84-9.2-5.77-18.7-5.77-28.52 0-11.4 3.01-20.9 9.03-28.52 4.41-5.59 9.8-9.84 16.14-12.75 6.35-2.91 12.78-4.37 19.3-4.37 4.13 0 9.17 1.05 15.11 3.17 5.94 2.11 9.94 3.17 11.99 3.17 2.29 0 6.64-1.12 13.06-3.35 6.42-2.23 12.01-3.23 16.74-3.01 9.49 0.44 17.5 3.53 24.03 9.27 -7.95 4.88-11.91 11.53-11.91 19.95 0 7.42 2.76 13.68 8.28 18.79 3.65 3.39 8.24 5.37 13.79 5.95-1.52 5.09-3.31 9.88-5.38 14.39zM107.2 26.65c-2.34-2.82-3.52-6.57-3.52-11.22 0-3.36 0.72-6.73 2.17-10.13 3.69 0.44 7.21 2.01 10.57 4.71 3.25 2.63 5.4 6.27 6.46 10.92 0.11 0.44 0.17 1.05 0.17 1.83 0 3.29-0.95 6.75-2.85 10.38-3.41-0.21-6.72-1.74-9.94-4.58z"/></svg>
                                Apple
                            </button>
                        </div>
                        
                        <div class="text-center">
                            <p class="text-muted small mb-0">Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Sign In</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        function togglePasswordVisibility(element) {
            const input = element.previousElementSibling;
            const icon = element.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.setAttribute('data-lucide', 'eye-off');
            } else {
                input.type = 'password';
                icon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }
    </script>
    <!-- Back to Top Button -->
    <button class="back-to-top" id="backToTopBtn" aria-label="Back to Top">
        <i data-lucide="arrow-up" width="24" height="24"></i>
    </button>
</body>
</html>
