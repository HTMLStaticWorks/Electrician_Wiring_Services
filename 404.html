<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | VoltCore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-darker min-vh-100 d-flex flex-column align-items-center justify-content-center position-relative overflow-hidden">
    
    <!-- Top Bar Toggles -->
    <div class="position-absolute top-0 end-0 p-4 d-flex gap-3 z-3">
        <button class="btn btn-link p-0 text-muted border border-secondary rounded-circle theme-toggle-btn d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;" aria-label="Toggle Theme"><i data-lucide="moon" width="18" height="18"></i></button>
        <button class="btn btn-link p-0 text-muted border border-secondary rounded-circle rtl-toggle-btn d-flex align-items-center justify-content-center text-decoration-none" style="width: 36px; height: 36px;" aria-label="Toggle RTL"><i data-lucide="arrow-right-left" width="18" height="18"></i></button>
    </div>

    <!-- Background Grid -->
    <div class="hero-bg-grid" style="opacity: 0.15; filter: invert(0);"></div>
    
    <!-- Hanging Wire / Broken Connection Graphic -->
    <svg class="position-absolute top-0 start-50 translate-middle-x" width="200" height="300" style="pointer-events: none;">
        <path d="M 100 0 L 100 150 M 100 200 L 100 300" stroke="var(--primary)" stroke-width="4" fill="none" stroke-dasharray="10, 10" class="electric-pulse" />
        <circle cx="100" cy="150" r="6" fill="var(--danger)" class="electric-pulse" />
        <circle cx="100" cy="200" r="6" fill="var(--danger)" class="electric-pulse" />
        <path d="M 80 160 L 120 180 M 120 170 L 80 190" stroke="var(--danger)" stroke-width="2" />
    </svg>

    <div class="container text-center position-relative z-1" style="margin-top: 50px;">
        <h1 class="display-1 fw-bold text-white mb-2" style="font-family: 'Space Grotesk', sans-serif;">4<i data-lucide="power-off" class="text-danger d-inline-block mx-1" width="72" height="72"></i>4</h1>
        <h2 class="font-heading fw-bold text-white mb-3">Connection Lost</h2>
        <p class="lead text-muted max-w-md mx-auto mb-5">Looks like this circuit has been disconnected. The page you are looking for has been moved or no longer exists.</p>
        
        <div class="d-flex flex-wrap justify-content-center gap-3 mobile-btn-stack">
            <a href="index.html" class="btn btn-electric btn-lg px-4"><i data-lucide="arrow-left" class="me-2"></i> Return to Grid</a>
            <a href="contact.html" class="btn btn-outline-light btn-lg px-4 border-2"><i data-lucide="headphones" class="me-2"></i> Support</a>
        </div>
    </div>

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
